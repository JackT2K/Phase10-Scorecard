{% extends 'base.html' %}{% block content %}<div class="split"><section><h1>Notebooks</h1><div class="list">{% for n in rows %}<div><b>{{n.name}}</b><span>{{n.game_count}} games · {{n.description}}</span><a class="button secondary" href="/notebooks/{{n.id}}/edit">Edit</a></div>{% endfor %}</div></section><form method="post" class="card"><h2>Add notebook</h2><label>Name<input name="name" required></label><label>Description<textarea name="description"></textarea></label><button>Add</button></form></div>{% endblock %}

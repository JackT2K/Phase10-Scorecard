<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P10</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#075bc7"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="P10"><link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png"><link rel="icon" href="/static/icons/favicon.ico"><link rel="stylesheet" href="/static/css/app.css?v=1"></head><body><header><a class="brand" href="/">P10</a><nav><a href="/games/new">Add Game</a><a href="/history">History</a><a href="/players">Players</a><a href="/notebooks">Notebooks</a><a href="/stats">Stats</a><a href="/live">Live</a><a href="/tv">TV</a><a href="/export.csv">Export</a></nav></header><main>{% for cat,m in get_flashed_messages(with_categories=true) %}<div class="flash {{cat}}">{{m}}</div>{% endfor %}{% block content %}{% endblock %}</main>{% block script %}{% endblock %}<aside id="pwa-install"><strong>Install P10</strong><p>Add P10 to this device for an app-style full-screen experience.</p><div class="install-actions"><button id="pwa-install-button">Install</button><button class="dismiss" id="pwa-dismiss">Not now</button></div></aside><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js'))}let deferredPrompt=null;const box=document.getElementById('pwa-install');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(!sessionStorage.getItem('p10-install-dismissed'))box.classList.add('show')});document.getElementById('pwa-install-button').addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;box.classList.remove('show')});document.getElementById('pwa-dismiss').addEventListener('click',()=>{sessionStorage.setItem('p10-install-dismissed','1');box.classList.remove('show')});window.addEventListener('appinstalled',()=>box.classList.remove('show'));</script></body></html>

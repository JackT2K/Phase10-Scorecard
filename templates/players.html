{% extends 'base.html' %}{% block content %}<div class="split"><section><h1>Players</h1><div class="list">{% for p in rows %}<div class="player"><i style="background:{{p.color}}"></i><a href="/players/{{p.id}}/stats"><b>{{p.name}}</b></a><span>{{'Active' if p.active else 'Inactive'}}</span><a class="button secondary" href="/players/{{p.id}}/edit">Edit</a></div>{% endfor %}</div></section><form method="post" class="card"><h2>Add player</h2><label>Name<input name="name" required></label><label>Color<input name="color" type="color" value="#34d399"></label><button>Add</button></form></div>{% endblock %}

{% extends 'base.html' %}{% block content %}<h1>Join live game</h1>{% if not g %}<form method="post" class="card narrow"><label>Four-character game code<input name="code" maxlength="4" autocapitalize="characters" required></label><button>Find game</button></form>{% else %}<p>Game {{g.code}} · Choose your player</p><div class="pick-grid">{% for p in roster %}<form method="post" action="/live/{{g.code}}/claim/{{p.id}}"><button class="identity" style="--pc:{{p.color}}"><i>{{p.initial}}</i><b>{{p.name}}</b></button></form>{% endfor %}</div>{% endif %}{% endblock %}

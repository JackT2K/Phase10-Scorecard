{% extends 'base.html' %}{% block content %}<h1>Edit notebook</h1><form method="post" class="card narrow"><label>Name<input name="name" value="{{n.name}}" required></label><label>Description<textarea name="description">{{n.description}}</textarea></label><button>Save changes</button></form><form method="post" action="/notebooks/{{n.id}}/delete" onsubmit="return confirm('Delete this notebook? Games will be kept under No notebook.')"><button class="danger">Delete notebook, keep games</button></form>{% endblock %}

{% extends 'base.html' %}{% block content %}<h1>{{'Edit game' if editing else 'Add historical game'}}</h1><form method="post"><div class="card grid"><label>Notebook<select id="notebook" name="notebook_id"><option value="">None</option>{% for n in notebooks %}<option value="{{n.id}}" {% if g and g.notebook_id==n.id %}selected{% endif %}>{{n.name}}</option>{% endfor %}</select></label><label>Sequence<input id="sequence" type="number" name="sequence_no" value="{{g.sequence_no if g and g.sequence_no is not none else ''}}"></label><label>Page<input name="page_no" value="{{g.page_no if g else ''}}"></label><label>Date<input type="date" name="played_date" value="{{g.played_date if g else ''}}"></label><label>Date accuracy><select name="date_accuracy">{% for v in ['unknown','exact','approximate','month','year'] %}<option {% if g and g.date_accuracy==v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></label><label>Status<select name="status">{% for v in ['complete','draft','historical partial','abandoned'] %}<option {% if g and g.status==v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></label><label>Entry type<select name="entry_type">{% for v,label in [('final','Final only'),('rounds','Per round'),('mixed','Mixed')] %}<option value="{{v}}" {% if g and g.entry_type==v %}selected{% endif %}>{{label}}</option>{% endfor %}</select></label></div><h2>Scores</h2><div class="scores">{% for p in players %}{% set x=selected.get(p.id) %}<div class="score" style="border-left-color:{{p.color}}"><label class="check"><input type="checkbox" name="use_{{p.id}}" {% if x %}checked{% endif %}><b>{{p.name}}</b></label><label>Final score<input type="number" min="0" name="score_{{p.id}}" value="{{x.final_score if x and x.final_score is not none else ''}}"></label><label>Final phase<input type="number" min="1" max="10" name="phase_{{p.id}}" value="{{x.final_phase if x and x.final_phase is not none else ''}}"></label><label>Result<select name="result_{{p.id}}">{% for v in ['finished','dnf','unknown'] %}<option value="{{v}}" {% if x and x.result_status==v %}selected{% endif %}>{{v|upper}}</option>{% endfor %}</select></label><label>Rounds<input name="rounds_{{p.id}}" value="{{x.rounds_text if x and x.rounds_text else ''}}" placeholder="10, 25, 0"></label></div>{% endfor %}</div><label>Notes<textarea name="notes">{{g.notes if g else ''}}</textarea></label><button>{{'Save changes' if editing else 'Save game'}}</button></form>{% if not editing %}<script>document.getElementById('notebook').addEventListener('change',async e=>{if(e.target.value&&!document.getElementById('sequence').value){const r=await fetch('/api/notebooks/'+e.target.value+'/next-sequence');const j=await r.json();document.getElementById('sequence').value=j.next}})</script>{% endif %}{% endblock %}

{% extends 'base.html' %}{% block content %}<p class="eyebrow">Player stats</p><h1>{{p.name}}</h1><div class="metrics"><div class="card"><b>{{s.avg_score or '—'}}</b><span>Average</span></div><div class="card"><b>{{s.completed or 0}}</b><span>Completed</span></div><div class="card"><b>{{s.dnfs or 0}}</b><span>DNFs</span></div><div class="card"><b>{{s.low or '—'}}</b><span>Lowest</span></div><div class="card"><b>{{s.high or '—'}}</b><span>Highest</span></div><div class="card"><b>{{s.avg_phase or '—'}}</b><span>Average phase</span></div></div><div class="card"><canvas id="chart"></canvas></div>{% endblock %}{% block script %}<script>const d={{trend|tojson}};new Chart(document.getElementById('chart'),{type:'line',data:{labels:d.map(x=>x.label),datasets:[{label:'Final score',data:d.map(x=>x.final_score),borderColor:'{{p.color}}'}]}});</script>{% endblock %}
